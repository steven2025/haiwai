<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>澜桥 LANQIAO · 跨境劳务智能面试系统</title>
<style>
/* ============================================================
   澜桥 LANQIAO · 跨境劳务全链路智能调度平台
   Interview Cabin / Single-file prototype
   ============================================================ */
:root{
  --bg:#050b14;
  --bg-2:#07111f;
  --panel:rgba(11,24,40,.82);
  --panel-2:rgba(15,31,51,.9);
  --panel-solid:#0b1828;
  --line:rgba(126,184,214,.14);
  --line-strong:rgba(126,226,218,.3);
  --ink:#e9f4f7;
  --ink-2:#a3b8c7;
  --ink-3:#647d90;
  --teal:#35e0c8;
  --teal-2:#19b8a6;
  --blue:#5b8dff;
  --violet:#9a86ff;
  --gold:#e8b45a;
  --red:#ff7180;
  --green:#47d6a0;
  --accent:var(--teal);
  --accent-2:var(--blue);
  --radius:18px;
  --font:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  --font-th:"Leelawadee UI","Tahoma","Segoe UI",sans-serif;
  --mono:"Bahnschrift","DIN Alternate","Cascadia Code","Consolas",monospace;
  --shadow:0 24px 70px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.55;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1000px 700px at 8% -12%,rgba(53,224,200,.16),transparent 58%),
    radial-gradient(1100px 760px at 102% 8%,rgba(91,141,255,.16),transparent 60%),
    radial-gradient(760px 560px at 52% 112%,rgba(154,134,255,.1),transparent 60%),
    linear-gradient(145deg,#050b14,#07111f 48%,#050b14);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:
    linear-gradient(rgba(126,184,214,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(126,184,214,.045) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse at 50% 35%,#000 10%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 10%,transparent 78%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::selection{background:rgba(53,224,200,.28);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(126,184,214,.18);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(126,184,214,.32);background-clip:content-box}
:focus-visible{outline:2px solid rgba(53,224,200,.7);outline-offset:2px}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.th{font-family:var(--font-th)}

/* ---------- shared atoms ---------- */
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:12px;position:relative;flex:0 0 auto;
  background:linear-gradient(145deg,rgba(53,224,200,.95),rgba(91,141,255,.9));
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 8px 24px rgba(53,224,200,.2);
  display:grid;place-items:center;color:#041411;
}
.brand-mark svg{width:23px;height:23px}
.brand-name{font-weight:700;font-size:17px;letter-spacing:.08em;white-space:nowrap}
.brand-sub{font-size:9px;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase;margin-top:1px;white-space:nowrap}
.brand-copy{min-width:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal);display:inline-block}
.dot.blue{background:var(--blue);box-shadow:0 0 12px var(--blue)}
.dot.gold{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:99px;
  font-size:11px;line-height:1;border:1px solid var(--line);color:var(--ink-2);
  background:rgba(255,255,255,.035);white-space:nowrap;
}
.pill.teal{color:var(--teal);border-color:rgba(53,224,200,.28);background:rgba(53,224,200,.09)}
.pill.blue{color:#9bbcff;border-color:rgba(91,141,255,.3);background:rgba(91,141,255,.1)}
.pill.gold{color:var(--gold);border-color:rgba(232,180,90,.3);background:rgba(232,180,90,.08)}
.pill.red{color:var(--red);border-color:rgba(255,113,128,.28);background:rgba(255,113,128,.08)}
.pill.green{color:var(--green);border-color:rgba(71,214,160,.3);background:rgba(71,214,160,.08)}
.pill.muted{color:var(--ink-3)}
.pill .dot{width:5px;height:5px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--teal);font-weight:650;
}
.eyebrow::before{content:"";width:20px;height:1px;background:linear-gradient(90deg,var(--teal),transparent)}
.btn{
  height:40px;padding:0 16px;border-radius:11px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.01em;
  border:1px solid transparent;transition:.18s ease;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{
  color:#031411;background:linear-gradient(135deg,var(--teal),#8bf5df 60%,#6ee7ff);
  box-shadow:0 10px 28px rgba(53,224,200,.2),0 0 0 1px rgba(255,255,255,.14) inset;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(53,224,200,.28)}
.btn-blue{
  color:#f4f8ff;background:linear-gradient(135deg,#3469e8,#5b8dff);
  box-shadow:0 10px 26px rgba(91,141,255,.22),0 0 0 1px rgba(255,255,255,.12) inset;
}
.btn-blue:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(91,141,255,.3)}
.btn-ghost{background:rgba(255,255,255,.035);border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:rgba(255,255,255,.07);color:var(--ink);border-color:rgba(126,184,214,.26)}
.btn-outline{background:transparent;border-color:rgba(53,224,200,.36);color:var(--teal)}
.btn-outline:hover{background:rgba(53,224,200,.08)}
.btn-red{background:rgba(255,113,128,.12);border-color:rgba(255,113,128,.32);color:#ff9aa5}
.btn-red:hover{background:rgba(255,113,128,.2)}
.btn-sm{height:32px;padding:0 11px;border-radius:9px;font-size:12px}
.btn-sm svg{width:14px;height:14px}
.btn-lg{height:50px;padding:0 22px;border-radius:14px;font-size:14px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;
  color:var(--ink-2);border:1px solid transparent;transition:.16s;
}
.icon-btn:hover{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--ink)}
/* 切换身份：与普通图标按钮明显区分 */
.role-switch-btn{width:auto;padding:0 10px;gap:5px;display:inline-flex;align-items:center;height:32px;border-radius:8px;font-size:11px;font-weight:600;color:var(--teal);border:1px solid rgba(53,224,200,.28);background:rgba(53,224,200,.08)}
.role-switch-btn:hover{background:rgba(53,224,200,.16);border-color:rgba(53,224,200,.45);color:var(--teal)}
.role-switch-btn svg{width:14px;height:14px}
@media (max-width:720px){.role-switch-btn span{display:none}.role-switch-btn{padding:0 8px}}
.icon-btn svg{width:18px;height:18px}
.back-btn{flex:0 0 auto;color:var(--ink-2);border-color:transparent}
.back-btn:hover{color:var(--teal);border-color:rgba(53,224,200,.24);background:rgba(53,224,200,.06)}
.lobby-back{position:fixed;top:22px;left:22px;z-index:20;background:rgba(8,20,33,.82);border:1px solid var(--line);backdrop-filter:blur(12px)}
.avatar{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#eafffb;flex:0 0 auto;
  background:linear-gradient(145deg,rgba(53,224,200,.28),rgba(91,141,255,.38));
  border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(53,224,200,.06);
}
.avatar.blue{background:linear-gradient(145deg,rgba(91,141,255,.36),rgba(154,134,255,.4))}
.avatar.gold{background:linear-gradient(145deg,rgba(232,180,90,.42),rgba(255,113,128,.32))}
.avatar.violet{background:linear-gradient(145deg,rgba(154,134,255,.4),rgba(91,141,255,.3))}
.avatar.red{background:linear-gradient(145deg,rgba(255,113,128,.38),rgba(232,180,90,.3))}
.card{
  position:relative;border-radius:var(--radius);border:1px solid var(--line);
  background:linear-gradient(158deg,rgba(15,32,52,.86),rgba(7,16,28,.84));
  box-shadow:0 1px 0 rgba(255,255,255,.035) inset,var(--shadow);
}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:650;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;color:var(--teal)}
.card-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.link{color:var(--teal);font-size:12px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link svg{width:13px;height:13px}
.divider{height:1px;background:var(--line);margin:16px 0}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tiny{font-size:11px}
.nowrap{white-space:nowrap}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:14px}
.col{display:flex;flex-direction:column}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-14{gap:14px}.gap-16{gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.span-2{grid-column:span 2}
.span-3{grid-column:span 3}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;position:relative;overflow:hidden}
.login-visual{position:relative;padding:42px 54px 34px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;z-index:1}
.login-visual::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 72%,rgba(5,11,20,.72));pointer-events:none;z-index:-1}
.login-map{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:.9;pointer-events:none}
.login-hero{position:relative;max-width:660px;margin:26px 0 18px;z-index:2}
.login-title{
  margin:16px 0 18px;font-size:clamp(40px,4.5vw,64px);line-height:1.07;letter-spacing:-.045em;
  font-weight:720;
}
.login-title em{font-style:normal;color:var(--teal);text-shadow:0 0 36px rgba(53,224,200,.32)}
.login-desc{max-width:520px;color:var(--ink-2);font-size:14px;line-height:1.9;margin:0}
.login-desc b{color:var(--ink);font-weight:600}
.login-stats{display:flex;gap:40px;margin-top:34px;flex-wrap:wrap}
.login-stat .num{font-family:var(--mono);font-size:27px;letter-spacing:.02em;color:var(--ink)}
.login-stat .num small{font-size:11px;color:var(--ink-3);margin-left:4px;letter-spacing:.08em}
.login-stat .lbl{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.04em}
.login-float{position:absolute;z-index:3;border:1px solid rgba(126,226,218,.2);background:rgba(8,20,33,.78);backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.float-a{left:54%;top:34%;padding:12px 15px;min-width:180px;animation:floatY 7s ease-in-out infinite}
.float-b{left:69%;top:56%;padding:12px 15px;min-width:200px;animation:floatY 8s ease-in-out 1.2s infinite}
.float-c{left:47%;top:63%;padding:10px 13px;animation:floatY 6.5s ease-in-out .6s infinite}
.float-label{font-size:9px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.float-main{display:flex;align-items:center;gap:9px;margin-top:5px;font-size:12px;color:var(--ink)}
.login-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--ink-3);font-size:10.5px;letter-spacing:.04em;position:relative;z-index:2}
.login-foot .row{gap:16px}
.mini-wave{display:flex;align-items:flex-end;gap:2px;height:20px;margin-top:9px;overflow:hidden}
.mini-wave i{display:block;width:2px;height:30%;border-radius:2px;background:linear-gradient(180deg,var(--teal),rgba(53,224,200,.18));animation:waveBar 1.15s ease-in-out infinite}
.mini-bars{display:flex;flex-direction:column;gap:3px;margin-top:9px}
.mini-bars i{display:block;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--teal),rgba(91,141,255,.4))}
.route-line{animation:routeDash 9s linear infinite}
.login-map text{pointer-events:none}
.hide-tr .stage-subtitle .tr,.hide-tr .msg .tr{display:none}
.report-inner{width:100%}
.match-badge .mini-ring .val{display:none}
.stage-wave i{height:var(--h,40%)}
@media (max-width:1320px){.mini-wave{display:none}}
.login-panel{
  display:flex;align-items:center;justify-content:center;padding:38px;
  border-left:1px solid var(--line);position:relative;
  background:linear-gradient(180deg,rgba(7,17,31,.5),rgba(5,11,20,.72));
  backdrop-filter:blur(22px);
}
.login-panel::before{content:"";position:absolute;inset:26px;border:1px solid rgba(126,184,214,.07);border-radius:24px;pointer-events:none}
.login-card{width:min(432px,100%);position:relative;z-index:2}
.login-card-head{margin-bottom:24px}
.login-kicker{font-size:10px;letter-spacing:.22em;color:var(--ink-3);text-transform:uppercase;margin-bottom:8px}
.login-card h2{font-size:26px;letter-spacing:-.025em;margin:0 0 6px;font-weight:700}
.login-card .sub{font-size:12.5px;color:var(--ink-2)}
.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;margin:22px 0 20px}
.role-switch button{height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);font-size:13px;font-weight:600;transition:.18s}
.role-switch button svg{width:17px;height:17px}
.role-switch button.active{color:#031411;background:linear-gradient(135deg,var(--teal),#9bf7e6);box-shadow:0 8px 22px rgba(53,224,200,.2)}
.role-switch button.active.recruiter{color:#f5f9ff;background:linear-gradient(135deg,#3469e8,#5b8dff);box-shadow:0 8px 22px rgba(91,141,255,.22)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--ink-3);margin:0 0 7px 2px;letter-spacing:.04em}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap>svg{position:absolute;left:14px;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.input-wrap input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(4,12,22,.58);padding:0 44px 0 42px;color:var(--ink);font-size:13.5px;transition:.18s;outline:none}
.input-wrap input:focus{border-color:rgba(53,224,200,.5);box-shadow:0 0 0 3px rgba(53,224,200,.08);background:rgba(5,15,26,.8)}
.input-wrap .peek{position:absolute;right:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--ink-3);border-radius:8px}
.input-wrap .peek:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.input-wrap .peek svg{width:16px;height:16px}
.login-card .btn-lg{width:100%;margin-top:6px}
.login-hint{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;font-size:11px;color:var(--ink-3)}
.demo-account{margin-top:18px;padding:12px 14px;border:1px dashed rgba(126,184,214,.18);border-radius:11px;background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:space-between;gap:10px}
.demo-account .mono{font-size:11px;color:var(--ink-2)}
.demo-account .tag{font-size:10px;color:var(--teal);letter-spacing:.08em}
.login-divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:10px;letter-spacing:.16em;margin:18px 0}
.login-divider::before,.login-divider::after{content:"";height:1px;flex:1;background:var(--line)}
.sso-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sso-row .btn{width:100%;height:42px;font-size:12px;font-weight:500}
.login-legal{text-align:center;font-size:10px;color:var(--ink-3);line-height:1.8;margin-top:18px}
.login-legal a{color:var(--ink-2);border-bottom:1px dotted rgba(163,184,199,.4)}
.settings-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:11px;cursor:pointer}
.settings-link:hover{color:var(--ink-2)}
.settings-link svg{width:14px;height:14px}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh;overflow:hidden}
.shell[data-role="recruiter"]{--accent:var(--blue);--accent-2:var(--violet)}
.sidebar{
  position:relative;z-index:12;display:flex;flex-direction:column;min-height:0;
  padding:22px 15px 16px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(7,17,31,.86),rgba(4,10,19,.9));
  backdrop-filter:blur(22px);
}
.sidebar .brand{padding:0 6px 0 4px}
.role-badge{display:flex;align-items:center;gap:7px;margin:18px 5px 0;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:10px;letter-spacing:.1em;color:var(--ink-3);background:rgba(255,255,255,.02);text-transform:uppercase}
.role-badge b{color:var(--accent);font-weight:650;letter-spacing:.08em}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:3px;overflow:auto;padding-bottom:8px}
.nav-label{font-size:9px;letter-spacing:.2em;color:var(--ink-3);margin:16px 11px 5px;text-transform:uppercase}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;height:44px;padding:0 12px;
  border-radius:11px;color:var(--ink-2);font-size:13px;text-align:left;border:1px solid transparent;
  transition:.16s ease;width:100%;
}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.045);color:var(--ink)}
.nav-item.active{
  color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent);
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),color-mix(in srgb,var(--accent) 2%,transparent));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 8%,transparent) inset;
}
.nav-item.active::before{content:"";position:absolute;left:-15px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.nav-item .nav-badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--ink-2)}
.nav-item.active .nav-badge{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.sidebar-spacer{flex:1;min-height:10px}
.sidebar-note{margin:0 5px 12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:10.5px;color:var(--ink-3);line-height:1.6}
.sidebar-note b{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:11px;margin-bottom:4px}
.sidebar-note svg{width:14px;height:14px;color:var(--accent)}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px 8px 4px;border-top:1px solid var(--line);margin-top:6px}
.sidebar-user .meta{min-width:0;flex:1}
.sidebar-user .name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .role{font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .icon-btn{width:30px;height:30px}
.sidebar-user .icon-btn svg{width:15px;height:15px}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{
  height:66px;flex:0 0 66px;display:flex;align-items:center;gap:14px;padding:0 28px;
  border-bottom:1px solid var(--line);background:rgba(5,12,22,.58);backdrop-filter:blur(18px);z-index:9;
}
.topbar .crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.topbar .crumb b{color:var(--ink-2);font-weight:500}
.crumb-sep{color:var(--ink-3);opacity:.5}
.topbar-search{position:relative;width:min(300px,26vw);margin-left:12px}
.topbar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.topbar-search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:0 34px 0 35px;font-size:12px;outline:none;transition:.18s}
.topbar-search input:focus{border-color:rgba(53,224,200,.35);background:rgba(255,255,255,.04)}
.topbar-search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.search-results{display:none;position:absolute;top:44px;left:0;width:440px;max-width:88vw;z-index:35;padding:6px;border-radius:12px;border:1px solid rgba(126,226,218,.2);background:rgba(7,18,30,.98);box-shadow:0 22px 60px rgba(0,0,0,.48);max-height:420px;overflow:auto;backdrop-filter:blur(18px)}
.search-results.on{display:block;animation:fadeUp .15s ease both}
.search-result{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;text-align:left;transition:.14s;border:1px solid transparent}
.search-result:hover,.search-result.active{background:rgba(53,224,200,.07);border-color:rgba(53,224,200,.14)}
.search-result .ico{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;background:rgba(53,224,200,.08);color:var(--teal)}
.search-result .ico svg{width:14px;height:14px}
.search-result .body{min-width:0;flex:1}
.search-result .t{font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result .s{font-size:9.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.sr-tag{font-size:8px;padding:1px 5px;border-radius:4px;background:rgba(126,184,214,.1);color:var(--ink-2);border:1px solid rgba(126,184,214,.14)}
.search-result .kind{font-size:8px;letter-spacing:.08em;color:var(--ink-3);flex:0 0 auto;border:1px solid var(--line);border-radius:4px;padding:2px 5px}
.search-result mark{background:rgba(53,224,200,.2);color:var(--teal);border-radius:2px;padding:0 1px}
.search-empty{padding:18px 12px;text-align:center;font-size:10.5px;color:var(--ink-3)}
.search-head{padding:5px 9px 6px;font-size:8.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.topbar .spacer{flex:1}
.live-status{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-2);padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02);white-space:nowrap}
.live-status .dot{animation:pulseDot 2.4s infinite}
.topbar .avatar{width:33px;height:33px;font-size:12px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 30px 44px;scroll-behavior:smooth}
.content-inner{max-width:1480px;margin:0 auto;animation:fadeUp .45s ease both}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.page-title{font-size:27px;line-height:1.2;letter-spacing:-.035em;font-weight:700;margin:0}
.page-title .accent{color:var(--accent)}
.page-sub{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- dashboard ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{
  position:relative;overflow:hidden;padding:16px 16px 14px;border-radius:15px;border:1px solid var(--line);
  background:linear-gradient(155deg,rgba(15,32,52,.78),rgba(7,16,28,.7));min-height:108px;
}
.kpi::after{content:"";position:absolute;right:-18px;top:-24px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 12%,transparent),transparent 68%)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:10.5px;letter-spacing:.03em}
.kpi-top svg{width:16px;height:16px;color:var(--accent);opacity:.85}
.kpi-val{font-family:var(--mono);font-size:28px;line-height:1.1;letter-spacing:.01em;margin-top:9px;display:flex;align-items:baseline;gap:7px}
.kpi-val small{font-family:var(--font);font-size:10px;color:var(--ink-3);font-weight:400;letter-spacing:.02em}
.kpi-trend{font-size:10px;margin-top:6px;display:flex;align-items:center;gap:5px;color:var(--ink-3)}
.kpi-trend b{color:var(--green);font-weight:600}
.kpi-trend.bad b{color:var(--red)}
.hero{
  position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;
  min-height:238px;padding:26px 28px;border-radius:22px;border:1px solid rgba(126,226,218,.17);
  background:
    radial-gradient(720px 320px at 12% 10%,rgba(53,224,200,.13),transparent 60%),
    radial-gradient(600px 360px at 92% 60%,rgba(91,141,255,.14),transparent 60%),
    linear-gradient(135deg,rgba(13,31,49,.94),rgba(7,17,30,.9));
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,var(--shadow);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(126,226,218,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(126,226,218,.06) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(90deg,#000,transparent 80%);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 80%);
}
.hero-route{position:absolute;right:0;top:0;width:62%;height:100%;pointer-events:none;opacity:.9}
.hero-main{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.hero-topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero h2{font-size:30px;line-height:1.18;letter-spacing:-.035em;margin:12px 0 6px;font-weight:700}
.hero h2 span{color:var(--teal)}
.hero-company{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}
.company-logo{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#041411;background:linear-gradient(145deg,#8bf5df,#35e0c8);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero-side{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;border-left:1px solid rgba(126,226,218,.14);padding-left:22px}
.hero-side .ring{width:132px;height:132px}
.hero-side .ring .val{font-size:30px}
.hero-side .ring .val small{font-size:11px}
.hero-side .side-label{font-size:10px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.hero-side .side-note{font-size:11px;color:var(--ink-2);text-align:center;line-height:1.6}
.hero-side .side-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ring{position:relative;display:grid;place-items:center;flex:0 0 auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:rgba(126,184,214,.12);stroke-width:8}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--accent) 45%,transparent));transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .val{font-family:var(--mono);font-size:24px;font-weight:650;display:flex;align-items:baseline;gap:2px;line-height:1}
.ring .val small{font-size:9px;color:var(--ink-3);font-family:var(--font)}
.ring.teal .prog{stroke:var(--teal)}
.ring.blue .prog{stroke:var(--blue)}
.ring.gold .prog{stroke:var(--gold)}
.ring.red .prog{stroke:var(--red)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:16px;margin-top:16px}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--teal),rgba(126,184,214,.14))}
.tl-item{position:relative;padding:0 0 17px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-21px;top:3px;width:13px;height:13px;border-radius:50%;border:1px solid rgba(126,184,214,.28);background:#0a1826;display:grid;place-items:center}
.tl-dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.tl-item.done .tl-dot{border-color:rgba(53,224,200,.5);background:rgba(53,224,200,.14)}
.tl-item.done .tl-dot::after{background:var(--teal);box-shadow:0 0 10px var(--teal)}
.tl-item.current .tl-dot{border-color:var(--teal);background:rgba(53,224,200,.18);box-shadow:0 0 0 4px rgba(53,224,200,.07)}
.tl-item.current .tl-dot::after{background:var(--teal);box-shadow:0 0 12px var(--teal);animation:pulseDot 2s infinite}
.tl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tl-title{font-size:12.5px;font-weight:600}
.tl-time{font-size:10px;color:var(--ink-3);font-family:var(--mono)}
.tl-desc{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.55}
.tl-item.current .tl-title{color:var(--teal)}
.schedule-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.schedule-item:last-child{border-bottom:0;padding-bottom:0}
.schedule-item:first-child{padding-top:0}
.schedule-date{width:44px;flex:0 0 auto;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.schedule-date b{display:block;font-family:var(--mono);font-size:16px;line-height:1.15;color:var(--accent)}
.schedule-date span{font-size:9px;color:var(--ink-3);letter-spacing:.08em}
.schedule-body{min-width:0;flex:1}
.schedule-body .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schedule-body .s{font-size:10.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schedule-item .pill{height:22px;font-size:9.5px;padding:0 8px}
.job-list{display:flex;flex-direction:column;gap:9px}
.job-mini{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.02);transition:.16s;cursor:pointer}
.job-mini:hover{border-color:rgba(53,224,200,.26);background:rgba(53,224,200,.035);transform:translateX(1px)}
.job-mini .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;background:linear-gradient(145deg,rgba(53,224,200,.2),rgba(91,141,255,.2));border:1px solid rgba(255,255,255,.1);color:var(--teal);flex:0 0 auto}
.job-mini .info{min-width:0;flex:1}
.job-mini .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-mini .s{font-size:10px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-mini .m{font-family:var(--mono);font-size:12px;color:var(--teal)}
.job-mini .m small{font-size:8px;color:var(--ink-3)}
.msg-list{display:flex;flex-direction:column;gap:12px}
.msg-line{display:flex;gap:9px}
.msg-line .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(53,224,200,.08);color:var(--teal);flex:0 0 auto}
.msg-line .ico svg{width:14px;height:14px}
.msg-line .body{font-size:11.5px;color:var(--ink-2);line-height:1.6}
.msg-line .body b{color:var(--ink);font-weight:600}
.msg-line .time{font-size:9px;color:var(--ink-3);margin-top:2px;font-family:var(--mono)}
.skill-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.skill-row:last-child{margin-bottom:0}
.skill-name{width:60px;font-size:10.5px;color:var(--ink-2);flex:0 0 auto}
.skill-track{height:5px;flex:1;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.skill-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#7ff3de)}
.skill-track i.blue{background:linear-gradient(90deg,#4d7dff,#9bbcff)}
.skill-track i.gold{background:linear-gradient(90deg,#d89a3f,#f2ce8c)}
.skill-track i.red{background:linear-gradient(90deg,#e05b6c,#ff9aa5)}
.skill-val{width:26px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--ink-3)}

/* recruiter */
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px}
.pipe-step{padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.022);position:relative;overflow:hidden}
.pipe-step::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:color-mix(in srgb,var(--accent) 55%,transparent);opacity:.55}
.pipe-step .l{font-size:10px;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:6px}
.pipe-step .n{font-family:var(--mono);font-size:21px;margin-top:4px;color:var(--ink)}
.pipe-step .n small{font-size:9px;color:var(--ink-3);font-family:var(--font);margin-left:3px}
.pipe-step .d{font-size:9px;color:var(--green);margin-top:1px}
.table-card{padding:0;overflow:hidden}
.table-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 18px 12px}
.table-tabs{display:flex;align-items:center;gap:3px;padding:3px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:9px}
.table-tabs button{height:28px;padding:0 10px;border-radius:6px;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.table-tabs button.active{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.table-wrap{overflow-x:auto;padding:0 8px 8px}
.data-table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
.data-table th{text-align:left;font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
.data-table td{padding:11px 10px;border-bottom:1px solid rgba(126,184,214,.08);font-size:11.5px;vertical-align:middle}
.data-table tbody tr{cursor:pointer;transition:.14s}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr:hover td{background:rgba(255,255,255,.032)}
.data-table tbody tr.highlight td{background:linear-gradient(90deg,rgba(53,224,200,.07),rgba(53,224,200,.015))}
.data-table tbody tr.highlight:hover td{background:linear-gradient(90deg,rgba(53,224,200,.1),rgba(53,224,200,.025))}
.cand-cell{display:flex;align-items:center;gap:9px;min-width:150px}
.cand-cell .avatar{width:32px;height:32px;font-size:11px}
.cand-cell .name{font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap}
.cand-cell .meta{font-size:9.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap}
.cell-job{font-size:11px;color:var(--ink-2);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-job small{display:block;font-size:9.5px;color:var(--ink-3)}
.match-badge{display:inline-flex;align-items:center;gap:7px;min-width:64px}
.match-badge .mini-ring{width:28px;height:28px;position:relative;flex:0 0 auto}
.match-badge .mini-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.match-badge .mini-ring .track{fill:none;stroke:rgba(126,184,214,.12);stroke-width:4}
.match-badge .mini-ring .prog{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round}
.match-badge .num{font-family:var(--mono);font-size:15px;color:var(--ink);line-height:1}
.match-badge .num small{font-size:8px;color:var(--ink-3)}
.match-badge.high .prog{stroke:var(--teal)}
.match-badge.mid .prog{stroke:var(--gold)}
.match-badge.low .prog{stroke:var(--red)}
.match-badge.high .num{color:var(--teal)}
.match-badge.mid .num{color:var(--gold)}
.match-badge.low .num{color:var(--red)}
.country-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-2);white-space:nowrap}
.country-tag svg{width:12px;height:12px;color:var(--ink-3)}
.row-actions{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.row-actions .btn{height:27px;padding:0 9px;font-size:10px;border-radius:7px}
.side-stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.country-bars{display:flex;flex-direction:column;gap:11px}
.country-bar .top{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;margin-bottom:5px}
.country-bar .top span{color:var(--ink-2)}
.country-bar .top b{font-family:var(--mono);font-weight:500;color:var(--ink-3)}
.country-track{height:6px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden}
.country-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--teal));opacity:.85}
.country-bar:nth-child(2) .country-track i{background:linear-gradient(90deg,#4d7dff,#9a86ff)}
.country-bar:nth-child(3) .country-track i{background:linear-gradient(90deg,#19b8a6,#66e8d4)}
.country-bar:nth-child(4) .country-track i{background:linear-gradient(90deg,#d89a3f,#f2ce8c)}
.country-bar:nth-child(5) .country-track i{background:linear-gradient(90deg,#e05b6c,#ff9aa5)}
.alert-item{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:10px;border:1px solid rgba(232,180,90,.16);background:rgba(232,180,90,.05);margin-bottom:8px}
.alert-item:last-child{margin-bottom:0}
.alert-item .ico{color:var(--gold);flex:0 0 auto;margin-top:1px}
.alert-item .ico svg{width:14px;height:14px}
.alert-item .t{font-size:11px;font-weight:600;color:var(--ink)}
.alert-item .s{font-size:10px;color:var(--ink-3);margin-top:2px;line-height:1.55}
.alert-item.red{border-color:rgba(255,113,128,.16);background:rgba(255,113,128,.045)}
.alert-item.red .ico{color:var(--red)}
.insight-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.insight{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.022);display:flex;align-items:center;gap:10px}
.insight .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(53,224,200,.08);color:var(--teal);flex:0 0 auto}
.insight .ico svg{width:15px;height:15px}
.insight .v{font-family:var(--mono);font-size:17px;line-height:1.1}
.insight .l{font-size:9.5px;color:var(--ink-3);margin-top:2px}

/* ---------- generic pages ---------- */
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.section-title h3{font-size:15px;margin:0;letter-spacing:-.01em}
.section-title .sub{font-size:10.5px;color:var(--ink-3)}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:29px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.025);font-size:10.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.chip.active{border-color:rgba(53,224,200,.3);color:var(--teal);background:rgba(53,224,200,.08)}
.chip svg{width:12px;height:12px}
.job-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.job-card{padding:18px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(155deg,rgba(15,32,52,.82),rgba(7,16,28,.78));transition:.18s;display:flex;flex-direction:column;gap:12px}
.job-card:hover{transform:translateY(-2px);border-color:rgba(53,224,200,.28);box-shadow:0 18px 50px rgba(0,0,0,.26)}
.job-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job-card .logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--teal);background:linear-gradient(145deg,rgba(53,224,200,.14),rgba(91,141,255,.14));border:1px solid rgba(126,226,218,.14)}
.job-card h4{margin:0;font-size:14px;letter-spacing:-.01em}
.job-card .company{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.job-card .desc{font-size:11px;color:var(--ink-2);line-height:1.7;min-height:38px}
.job-meta{display:flex;flex-wrap:wrap;gap:5px}
.job-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px;border-top:1px solid var(--line)}
.job-card-foot .salary{font-family:var(--mono);font-size:13px;color:var(--gold)}
.job-card-foot .salary small{font-size:9px;color:var(--ink-3);font-family:var(--font);margin-left:2px}
.list-card{padding:0;overflow:hidden}
.list-row{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line);transition:.15s}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:rgba(255,255,255,.028)}
.list-row .body{flex:1;min-width:0}
.list-row .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.list-row .s{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.list-row .end{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.empty{padding:42px 18px;text-align:center;color:var(--ink-3);font-size:12px}
.empty svg{width:38px;height:38px;opacity:.4;margin-bottom:8px}

/* ---------- analytics ---------- */
.chart-card{min-height:260px}
.bar-chart{display:flex;align-items:flex-end;gap:12px;height:180px;padding:12px 4px 0;border-bottom:1px solid var(--line)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar-col .bar{width:min(34px,70%);border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--teal),rgba(53,224,200,.12));position:relative;transition:.4s;min-height:4px;box-shadow:0 0 18px rgba(53,224,200,.08)}
.bar-col .bar.blue{background:linear-gradient(180deg,var(--blue),rgba(91,141,255,.1))}
.bar-col .bar .tip{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--ink-2);opacity:0;transition:.15s;white-space:nowrap}
.bar-col:hover .bar .tip{opacity:1}
.bar-col .lbl{font-size:9px;color:var(--ink-3);white-space:nowrap}
.funnel-chart{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.funnel-row{display:flex;align-items:center;gap:9px}
.funnel-row .lbl{width:58px;font-size:10px;color:var(--ink-3);text-align:right;flex:0 0 auto}
.funnel-row .track{flex:1;height:22px;border-radius:5px;background:rgba(255,255,255,.035);overflow:hidden;position:relative}
.funnel-row .track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,rgba(53,224,200,.75),rgba(91,141,255,.55));opacity:.8}
.funnel-row .val{width:48px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--ink-2);flex:0 0 auto}
.donut-wrap{display:flex;align-items:center;gap:22px}
.donut{width:150px;height:150px;position:relative;flex:0 0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:14}
.donut .seg{fill:none;stroke-width:14;stroke-linecap:butt}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-center b{font-family:var(--mono);font-size:24px;line-height:1;display:block}
.donut-center span{font-size:9px;color:var(--ink-3);display:block;margin-top:2px}
.legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.legend-item{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--ink-2)}
.legend-item i{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.legend-item b{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--ink-3);padding-left:12px}
.trend-svg{width:100%;height:170px;overflow:visible}
.trend-svg .grid{stroke:rgba(126,184,214,.09);stroke-width:1}
.trend-svg .area{fill:url(#trendArea)}
.trend-svg .line{fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(53,224,200,.28))}
.trend-svg .point{fill:#07111f;stroke:var(--teal);stroke-width:2}
.trend-svg text{font-family:var(--mono);font-size:8px;fill:var(--ink-3)}

/* ---------- job drawer ---------- */
.drawer-mask{position:fixed;inset:0;background:rgba(2,7,12,.62);backdrop-filter:blur(5px);z-index:80;opacity:0;pointer-events:none;transition:.2s}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);z-index:81;background:linear-gradient(180deg,#0a1828,#07111f);border-left:1px solid var(--line);box-shadow:-30px 0 80px rgba(0,0,0,.35);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.drawer-head h3{margin:0;font-size:18px}
.drawer-body{padding:20px 22px;overflow:auto;flex:1}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:rgba(5,12,22,.4)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid rgba(126,184,214,.08);font-size:11.5px}
.kv span{color:var(--ink-3)}
.kv b{font-weight:500;color:var(--ink);text-align:right}
.drawer-section{margin-top:18px}
.drawer-section h4{font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin:0 0 9px}
.drawer-section p{font-size:11.5px;color:var(--ink-2);line-height:1.75;margin:0}

/* ---------- interview shell ---------- */
.interview-screen{
  position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(1000px 700px at 18% 8%,rgba(53,224,200,.12),transparent 58%),
    radial-gradient(900px 700px at 92% 88%,rgba(91,141,255,.12),transparent 60%),
    linear-gradient(145deg,#040a12,#071422 52%,#040a12);
}
.iv-top{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(4,10,18,.5);backdrop-filter:blur(18px);z-index:5}
.iv-top .brand-mark{width:33px;height:33px;border-radius:10px}
.iv-top .brand-name{font-size:14px}
.iv-top .brand-sub{font-size:8px}
.iv-sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.iv-context{display:flex;align-items:center;gap:9px;min-width:0}
.iv-context .avatar{width:31px;height:31px;font-size:11px}
.iv-context .t{font-size:12px;font-weight:600;white-space:nowrap}
.iv-context .s{font-size:9.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-top .spacer{flex:1}
.iv-top .live-status{height:31px}
.iv-progress{display:flex;align-items:center;gap:7px}
.iv-progress .dot-step{width:18px;height:3px;border-radius:99px;background:rgba(255,255,255,.1);transition:.25s}
.iv-progress .dot-step.on{background:var(--teal);box-shadow:0 0 8px rgba(53,224,200,.5)}
.iv-progress .dot-step.done{background:rgba(53,224,200,.35)}
.iv-timer{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.02)}
.iv-body{flex:1;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(430px,.92fr);gap:16px;padding:16px 20px 14px;min-height:0}
.stage{position:relative;min-height:0;display:flex;flex-direction:column;border-radius:20px;border:1px solid rgba(126,226,218,.2);overflow:hidden;background:#06101c;box-shadow:0 26px 80px rgba(0,0,0,.32)}
.stage-view{flex:1;position:relative;min-height:0;overflow:hidden;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 42%,rgba(53,224,200,.13),transparent 46%),
  radial-gradient(circle at 18% 12%,rgba(91,141,255,.14),transparent 36%),
  linear-gradient(160deg,#0a1a2b,#050d17 70%);
}
.stage-view::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
  background-image:linear-gradient(rgba(126,226,218,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(126,226,218,.06) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(circle at 50% 45%,#000 12%,transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 12%,transparent 72%);
}
.stage-view::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:linear-gradient(180deg,rgba(4,10,18,.52),transparent 18%,transparent 72%,rgba(4,10,18,.78));
}
.stage-vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.6);z-index:4}
.stage-scan{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.13;background:repeating-linear-gradient(180deg,rgba(255,255,255,.08) 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.stage-orbit{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(126,226,218,.1);pointer-events:none}
.stage-orbit::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px dashed rgba(126,226,218,.1)}
.stage-orbit::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px solid rgba(91,141,255,.1)}
.stage-orbit .orbit-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 14px var(--teal);top:12%;left:18%}
.dh-wrap{position:relative;z-index:3;width:min(76%,520px);max-height:86%;aspect-ratio:1/1;display:grid;place-items:center;transform:translateY(3%)}
.candidate-feed{position:absolute;inset:0;z-index:3;overflow:hidden;background:#07121e}
.candidate-feed::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(6,20,30,.16),transparent 38%,rgba(53,224,200,.055) 70%,rgba(6,15,25,.16));mix-blend-mode:screen}
.candidate-feed::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(3,9,15,.58) 0%,rgba(3,9,15,.08) 22%,transparent 52%,rgba(3,9,15,.72) 100%),radial-gradient(circle at 52% 36%,transparent 30%,rgba(3,9,15,.34) 100%)}
.dh-photo{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;filter:saturate(.8) contrast(1.03) brightness(.9);transform:scale(1.012)}
.talking .dh-photo{animation:feedTalk 3.2s ease-in-out infinite alternate}
@keyframes feedTalk{0%{transform:scale(1.012)}100%{transform:scale(1.036)}}
.dh-svg{width:100%;height:100%;display:block;filter:saturate(.92) contrast(1.04)}
.dh-head{transform-origin:280px 300px;animation:dhBreathe 6.4s ease-in-out infinite}
.dh-eyes{transform-origin:280px 236px;animation:dhBlink 6.8s infinite}
.dh-mouth{transform-origin:280px 282px}
.dh-body{transform-origin:280px 500px}
.talking .dh-mouth{animation:dhTalk .22s ease-in-out infinite alternate}
.talking .dh-head{animation:dhTalkHead .9s ease-in-out infinite alternate}
.talking .dh-body{animation:dhBody .9s ease-in-out infinite alternate}
@keyframes dhBreathe{0%,100%{transform:translateY(0) rotate(-.2deg)}50%{transform:translateY(4px) rotate(.2deg)}}
@keyframes dhTalkHead{0%{transform:translateY(0) rotate(-.6deg)}100%{transform:translateY(3px) rotate(.5deg)}}
@keyframes dhBody{0%,100%{transform:translateY(0)}100%{transform:translateY(1.5px)}}
@keyframes dhBlink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
@keyframes dhTalk{0%{transform:scaleY(.35)}100%{transform:scaleY(1.65)}}
.stage-top-left{position:absolute;top:15px;left:16px;z-index:7;display:flex;flex-direction:column;gap:6px}
.stage-top-right{position:absolute;top:15px;right:16px;z-index:7;display:flex;align-items:center;gap:6px}
.stage-corner{position:absolute;width:34px;height:34px;border-color:rgba(126,226,218,.35);border-style:solid;z-index:6;pointer-events:none}
.stage-corner.tl{top:12px;left:12px;border-width:1px 0 0 1px;border-radius:8px 0 0 0}
.stage-corner.tr{top:12px;right:12px;border-width:1px 1px 0 0;border-radius:0 8px 0 0}
.stage-corner.bl{bottom:12px;left:12px;border-width:0 0 1px 1px;border-radius:0 0 0 8px}
.stage-corner.br{bottom:12px;right:12px;border-width:0 1px 1px 0;border-radius:0 0 8px 0}
.stage-badge{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 9px;border-radius:6px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);background:rgba(4,10,18,.58);border:1px solid rgba(126,184,214,.18);backdrop-filter:blur(8px)}
.stage-badge .dot{width:5px;height:5px}
.stage-badge.live{color:#ffb3bb;border-color:rgba(255,113,128,.26);background:rgba(255,113,128,.08)}
.stage-badge.live .dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:pulseDot 1.4s infinite}
.stage-name{position:absolute;left:18px;bottom:108px;z-index:6;display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;background:rgba(4,10,18,.55);border:1px solid rgba(126,184,214,.14);backdrop-filter:blur(10px)}
.stage-name .avatar{width:30px;height:30px;font-size:10px}
.stage-name .n{font-size:12px;font-weight:600}
.stage-name .r{font-size:9px;color:var(--ink-3);margin-top:1px}
.stage-wave{position:absolute;right:18px;bottom:112px;z-index:6;display:flex;align-items:flex-end;gap:2px;height:22px;opacity:.6}
.stage-wave i{width:2px;border-radius:2px;background:var(--teal);height:30%;animation:waveBar 1.1s ease-in-out infinite}
.stage-wave i:nth-child(2n){animation-delay:.12s}.stage-wave i:nth-child(3n){animation-delay:.24s}.stage-wave i:nth-child(4n){animation-delay:.36s}
.talking .stage-wave i{opacity:1}
.stage-subtitle{position:absolute;left:18px;right:18px;bottom:16px;z-index:7;padding:12px 14px;border-radius:12px;background:rgba(4,10,18,.74);border:1px solid rgba(126,226,218,.18);backdrop-filter:blur(14px);min-height:56px}
.stage-subtitle .src{font-size:13px;line-height:1.55;color:#f0fbff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stage-subtitle .tr{font-family:var(--font-th);font-size:11.5px;line-height:1.55;color:var(--teal);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stage-subtitle .label{font-size:8px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.stage-subtitle .label .dot{width:4px;height:4px}
.stage-controls{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:9px;padding:0 16px;border-top:1px solid var(--line);background:rgba(6,15,26,.84);backdrop-filter:blur(16px)}
.ctl{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:rgba(255,255,255,.035);transition:.16s;flex:0 0 auto}
.ctl svg{width:17px;height:17px}
.ctl:hover{color:var(--ink);border-color:rgba(126,226,218,.3);background:rgba(255,255,255,.06)}
.ctl.active{color:#031411;background:var(--teal);border-color:var(--teal);box-shadow:0 0 20px rgba(53,224,200,.25)}
.ctl.danger{color:#ff9aa5;border-color:rgba(255,113,128,.3);background:rgba(255,113,128,.09)}
.ctl.danger:hover{background:rgba(255,113,128,.18)}
.ctl.blue{color:#0b1630;background:var(--blue);border-color:var(--blue)}
.ctl-label{font-size:9.5px;color:var(--ink-3);margin-top:2px;text-align:center;white-space:nowrap}
.ctl-group{display:flex;flex-direction:column;align-items:center;gap:1px}
.stage-controls .spacer{flex:1}
.stage-controls .btn{height:36px;font-size:11.5px;border-radius:9px}
.stage-controls .live-time{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-right:6px}

/* interview right panel */
.iv-panel{min-height:0;display:flex;flex-direction:column;border-radius:20px;border:1px solid var(--line);background:linear-gradient(165deg,rgba(14,30,49,.9),rgba(6,14,25,.9));box-shadow:var(--shadow);overflow:hidden}
.iv-panel-head{flex:0 0 auto;padding:15px 17px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.iv-panel-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}
.iv-panel-title svg{width:15px;height:15px;color:var(--teal)}
.iv-panel-tabs{display:flex;gap:2px;padding:2px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:7px}
.iv-panel-tabs button{height:24px;padding:0 8px;border-radius:5px;font-size:9.5px;color:var(--ink-3)}
.iv-panel-tabs button.active{background:rgba(255,255,255,.08);color:var(--ink)}
.question-card{margin:13px 15px 0;padding:14px 15px;border-radius:13px;border:1px solid rgba(126,226,218,.16);background:linear-gradient(145deg,rgba(53,224,200,.07),rgba(91,141,255,.035));position:relative;overflow:hidden;flex:0 0 auto}
.question-card::after{content:"";position:absolute;right:-20px;top:-24px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(53,224,200,.14),transparent 65%)}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.q-no{font-family:var(--mono);font-size:10px;color:var(--teal);letter-spacing:.1em}
.q-focus{font-size:9px;color:var(--ink-3)}
.q-text{font-size:13px;line-height:1.65;color:var(--ink);font-weight:500;position:relative;z-index:1}
.q-th{font-family:var(--font-th);font-size:10.5px;line-height:1.6;color:var(--ink-2);margin-top:6px;padding-top:6px;border-top:1px solid rgba(126,226,218,.1)}
.q-th-label{font-family:var(--font);font-size:8px;letter-spacing:.12em;color:var(--teal);margin-right:4px;text-transform:uppercase}
.transcript{flex:1;min-height:0;overflow-y:auto;padding:13px 15px 8px;scroll-behavior:smooth}
.transcript-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink-3);font-size:11px;gap:8px;padding:20px}
.transcript-empty .orb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(126,226,218,.2);background:radial-gradient(circle,rgba(53,224,200,.16),transparent 65%);color:var(--teal)}
.transcript-empty .orb svg{width:22px;height:22px}
.msg{margin-bottom:13px;animation:fadeUp .25s ease both}
.msg:last-child{margin-bottom:0}
.msg-meta{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:8.5px;color:var(--ink-3);letter-spacing:.04em}
.msg-who{font-size:9.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.msg-dir{padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.04);font-family:var(--mono);font-size:7.5px}
.msg-time{margin-left:auto;font-family:var(--mono);font-size:8px}
.msg-bubble{padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.032);border:1px solid rgba(126,184,214,.08)}
.msg.interviewer .msg-bubble{border-left:2px solid var(--blue)}
.msg.candidate .msg-bubble{border-left:2px solid var(--teal)}
.msg .src{font-size:11.5px;line-height:1.65;color:var(--ink)}
.msg .tr{font-family:var(--font-th);font-size:9.5px;line-height:1.55;color:var(--ink-3);margin-top:4px;padding-top:4px;border-top:1px dashed rgba(126,184,214,.1)}
.msg .tr.cn{font-family:var(--font);color:var(--ink-2)}
.msg .badge-live{display:inline-flex;align-items:center;gap:3px;font-size:7px;color:var(--teal);margin-left:5px;vertical-align:middle}
.msg .badge-live .dot{width:3px;height:3px}
.thinking{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;background:rgba(53,224,200,.04);border:1px dashed rgba(53,224,200,.2);font-size:10px;color:var(--teal);margin-bottom:10px}
.thinking .dots{display:flex;gap:3px}
.thinking .dots i{width:4px;height:4px;border-radius:50%;background:var(--teal);animation:thinkDot 1s infinite}
.thinking .dots i:nth-child(2){animation-delay:.15s}.thinking .dots i:nth-child(3){animation-delay:.3s}
.iv-composer{flex:0 0 auto;padding:10px 14px 12px;border-top:1px solid var(--line);background:rgba(4,10,18,.28)}
.composer-row{display:flex;align-items:flex-end;gap:8px}
.composer-input{flex:1;min-height:42px;max-height:92px;resize:none;border-radius:10px;border:1px solid var(--line);background:rgba(4,12,22,.55);padding:10px 12px;font-size:11.5px;line-height:1.5;outline:none;transition:.16s}
.composer-input:focus{border-color:rgba(53,224,200,.36);background:rgba(4,12,22,.75)}
.composer-input::placeholder{color:var(--ink-3)}
.composer-send{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#031411;background:linear-gradient(135deg,var(--teal),#8bf5df);box-shadow:0 8px 22px rgba(53,224,200,.18);flex:0 0 auto}
.composer-send svg{width:17px;height:17px}
.composer-send:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.composer-tools{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.mini-toggle{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:9.5px;color:var(--ink-3);background:rgba(255,255,255,.02);cursor:pointer}
.mini-toggle svg{width:12px;height:12px}
.mini-toggle.on{color:var(--teal);border-color:rgba(53,224,200,.28);background:rgba(53,224,200,.07)}
.quick-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.quick-chip{font-size:9px;color:var(--ink-2);padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left;line-height:1.35;transition:.15s}
.quick-chip:hover{color:var(--teal);border-color:rgba(53,224,200,.26);background:rgba(53,224,200,.06)}
.iv-footnote{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 16px;border-top:1px solid var(--line);font-size:8.5px;color:var(--ink-3);background:rgba(4,10,18,.3)}
.iv-footnote .row{gap:11px}
.iv-footnote .dot{width:4px;height:4px}
.interviewer-cam{position:relative;width:100%;height:148px;aspect-ratio:auto;border-radius:11px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1b3450,#081321);border:1px solid var(--line);margin-bottom:9px}
.interviewer-cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.interviewer-cam .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink-3);font-size:9px;text-align:center}
.interviewer-cam .placeholder .avatar{width:46px;height:46px;font-size:16px}
.interviewer-cam .cam-tag{position:absolute;left:7px;bottom:6px;font-size:8px;color:var(--ink-2);background:rgba(4,10,18,.6);padding:2px 6px;border-radius:4px;backdrop-filter:blur(6px)}
.interviewer-cam .cam-live{position:absolute;right:7px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}

/* ---------- lobby ---------- */
.lobby{min-height:100vh;display:grid;place-items:center;padding:28px;position:relative;overflow:auto}
.lobby-card{width:min(980px,100%);display:grid;grid-template-columns:1.15fr .85fr;border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(14,30,49,.94),rgba(6,14,25,.94));box-shadow:var(--shadow);overflow:hidden}
.lobby-main{padding:30px 32px}
.lobby-side{padding:26px;border-left:1px solid var(--line);background:rgba(4,10,18,.28);display:flex;flex-direction:column;gap:14px}
.lobby h1{font-size:26px;letter-spacing:-.03em;margin:0 0 6px}
.lobby .sub{font-size:12px;color:var(--ink-2);line-height:1.7}
.device-preview{position:relative;margin-top:18px;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#1a334d,#07111f);border:1px solid var(--line)}
.device-preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.device-preview .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);font-size:11px;text-align:center;padding:20px}
.device-preview .placeholder .orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(53,224,200,.08);border:1px solid rgba(53,224,200,.2);color:var(--teal)}
.device-preview .placeholder .orb svg{width:26px;height:26px}
.device-preview .badge-cam{position:absolute;left:10px;bottom:9px;font-size:9px;color:var(--ink-2);background:rgba(4,10,18,.65);padding:3px 7px;border-radius:5px;backdrop-filter:blur(6px)}
.device-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.device-item{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:9.5px;color:var(--ink-2)}
.device-item svg{width:13px;height:13px;color:var(--green)}
.device-item.warn svg{color:var(--gold)}
.device-item .check{margin-left:auto;color:var(--green);font-size:9px}
.lobby-side h3{font-size:11px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin:0}
.lobby-person{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.lobby-person .avatar{width:40px;height:40px}
.lobby-person .n{font-size:12px;font-weight:600}
.lobby-person .r{font-size:9.5px;color:var(--ink-3);margin-top:2px}
.lobby-tip{font-size:10px;color:var(--ink-3);line-height:1.7;padding:10px 11px;border-radius:9px;background:rgba(232,180,90,.05);border:1px solid rgba(232,180,90,.15)}
.lobby-tip b{color:var(--gold);font-weight:600}
.lobby-actions{display:flex;gap:8px;margin-top:auto}
.lobby-actions .btn{flex:1}

/* ---------- report ---------- */
.report-screen{position:fixed;inset:0;z-index:45;overflow:auto;background:
  radial-gradient(900px 600px at 12% 0%,rgba(53,224,200,.11),transparent 58%),
  radial-gradient(900px 600px at 92% 100%,rgba(91,141,255,.12),transparent 60%),
  #050b14;}
.report-top{height:62px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(5,12,22,.6);backdrop-filter:blur(18px);position:sticky;top:0;z-index:5}
.report-wrap{max-width:1240px;margin:0 auto;padding:26px 28px 50px}
.report-hero{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;padding:24px;border-radius:22px;border:1px solid rgba(126,226,218,.17);background:linear-gradient(145deg,rgba(14,31,50,.9),rgba(7,16,28,.9));box-shadow:var(--shadow);position:relative;overflow:hidden}
.report-hero::after{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(53,224,200,.12),transparent 65%);pointer-events:none}
.report-score{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-right:1px solid var(--line);padding-right:22px}
.report-score .ring{width:170px;height:170px}
.report-score .ring .val{font-size:42px}
.report-score .verdict{font-size:12.5px;font-weight:600;color:var(--teal);text-align:center}
.report-score .verdict-sub{font-size:9.5px;color:var(--ink-3);text-align:center;margin-top:2px}
.report-main{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.report-main h1{font-size:25px;letter-spacing:-.03em;margin:0;line-height:1.25}
.report-main .job{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.report-main .summary{font-size:12px;line-height:1.85;color:var(--ink-2);max-width:720px}
.report-meta{display:flex;gap:8px;flex-wrap:wrap}
.report-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:16px;margin-top:16px}
.dim-list{display:flex;flex-direction:column;gap:13px}
.dim{display:flex;flex-direction:column;gap:5px}
.dim-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px}
.dim-top .n{color:var(--ink-2);display:flex;align-items:center;gap:6px}
.dim-top .n b{color:var(--ink);font-weight:600;font-size:11.5px}
.dim-top .v{font-family:var(--mono);font-size:13px}
.dim-track{height:6px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden}
.dim-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#7ff3de);transition:width 1s ease}
.dim-track i.blue{background:linear-gradient(90deg,var(--blue),#9bbcff)}
.dim-track i.gold{background:linear-gradient(90deg,#d89a3f,#f2ce8c)}
.dim-track i.red{background:linear-gradient(90deg,#e05b6c,#ff9aa5)}
.dim-note{font-size:9.5px;color:var(--ink-3);line-height:1.5}
.pronounce{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;padding:14px;border-radius:12px;border:1px solid rgba(232,180,90,.16);background:linear-gradient(145deg,rgba(232,180,90,.05),rgba(255,255,255,.015));margin-top:14px}
.pronounce .ring{width:120px;height:120px}
.pronounce .ring .val{font-size:28px}
.pronounce .ring .prog{stroke:var(--gold)}
.pronounce .p-title{font-size:11px;font-weight:600;color:var(--gold);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.pronounce .p-title svg{width:13px;height:13px}
.pronounce .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.pronounce .p-row{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;color:var(--ink-3);gap:10px}
.pronounce .p-row b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}
.pronounce .p-comment{font-size:9.5px;color:var(--ink-3);line-height:1.55;margin-top:8px;grid-column:1/-1;padding-top:7px;border-top:1px solid rgba(232,180,90,.1)}
.sw-list{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;gap:8px;font-size:11px;line-height:1.6;color:var(--ink-2);padding:9px 10px;border-radius:8px;background:rgba(255,255,255,.022);border:1px solid var(--line)}
.sw .ico{flex:0 0 auto;margin-top:1px}
.sw .ico svg{width:13px;height:13px}
.sw.good .ico{color:var(--green)}.sw.risk .ico{color:var(--gold)}
.sw .t{font-size:9px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-bottom:2px}
.sw b{color:var(--ink);font-weight:600}
.q-suggest{display:flex;flex-direction:column;gap:7px}
.q-suggest .item{display:flex;gap:9px;padding:9px 10px;border-radius:8px;background:rgba(255,255,255,.022);border:1px solid var(--line);font-size:10.5px;line-height:1.55;color:var(--ink-2)}
.q-suggest .item .n{font-family:var(--mono);color:var(--teal);font-size:9px;flex:0 0 auto;margin-top:1px}
.report-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px}
.report-note{font-size:9.5px;color:var(--ink-3);line-height:1.7;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ---------- modal / toast / misc ---------- */
.modal-mask{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:22px;background:rgba(2,7,12,.72);backdrop-filter:blur(8px);animation:fadeIn .18s ease}
.modal-card{width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:18px;border:1px solid rgba(126,226,218,.18);background:linear-gradient(160deg,#0d1e32,#07111f);box-shadow:0 30px 100px rgba(0,0,0,.5);padding:22px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-head h3{margin:0;font-size:18px;letter-spacing:-.02em}
.modal-head .sub{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.modal-section{margin-bottom:16px}
.modal-section h4{font-size:10px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin:0 0 8px}
.modal .field{margin-bottom:12px}
.modal .input-wrap input{height:42px;font-size:12px}
.settings-tabs{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.03);margin-bottom:16px}
.settings-tabs button{flex:1;height:30px;border-radius:6px;font-size:10px;color:var(--ink-3)}
.settings-tabs button.active{background:rgba(255,255,255,.08);color:var(--ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.toggle-row .t{font-size:11.5px;color:var(--ink-2)}
.toggle-row .s{font-size:9.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.switch{width:38px;height:22px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:.18s;cursor:pointer}
.switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#8ba2b5;top:2px;left:2px;transition:.18s}
.switch.on{background:rgba(53,224,200,.22);border-color:rgba(53,224,200,.4)}
.switch.on::after{left:18px;background:var(--teal);box-shadow:0 0 10px rgba(53,224,200,.5)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:200;display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:10px;border:1px solid rgba(126,226,218,.22);background:rgba(8,20,33,.94);color:var(--ink);font-size:11.5px;box-shadow:0 16px 50px rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:.22s;backdrop-filter:blur(14px);max-width:min(520px,90vw)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:15px;height:15px;color:var(--teal);flex:0 0 auto}
.toast.warn{border-color:rgba(232,180,90,.25)}
.toast.warn svg{color:var(--gold)}
.toast.error{border-color:rgba(255,113,128,.26)}
.toast.error svg{color:var(--red)}
.demo-fab{position:fixed;right:22px;bottom:22px;z-index:35;display:flex;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:99px;border:1px solid rgba(53,224,200,.25);background:rgba(8,20,33,.86);backdrop-filter:blur(14px);color:var(--ink-2);font-size:10.5px;box-shadow:0 14px 40px rgba(0,0,0,.3);transition:.18s}
.demo-fab:hover{color:var(--teal);border-color:rgba(53,224,200,.4);transform:translateY(-1px)}
.demo-fab svg{width:14px;height:14px;color:var(--teal)}
.demo-steps{display:flex;flex-direction:column;gap:8px}
.demo-step{display:flex;gap:11px;padding:10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.02);cursor:pointer;transition:.15s}
.demo-step:hover{border-color:rgba(53,224,200,.25);background:rgba(53,224,200,.04)}
.demo-step .n{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--teal);background:rgba(53,224,200,.08);border:1px solid rgba(53,224,200,.18);flex:0 0 auto}
.demo-step .t{font-size:11.5px;font-weight:600}
.demo-step .s{font-size:9.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.demo-step .time{margin-left:auto;font-size:8.5px;color:var(--ink-3);font-family:var(--mono);flex:0 0 auto;padding-top:2px}

/* ---------- animations ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@keyframes thinkDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes waveBar{0%,100%{height:22%}50%{height:92%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanLine{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes routeDash{to{stroke-dashoffset:-220}}
@keyframes blinkCaret{50%{opacity:0}}
.type-caret::after{content:"";display:inline-block;width:1.5px;height:1em;background:var(--teal);margin-left:2px;vertical-align:-.12em;animation:blinkCaret .8s step-end infinite}

/* ---------- responsive ---------- */
@media (max-height:820px){
  .login-float{display:none}
  .login-hero{margin-top:8px}
  .login-title{font-size:clamp(36px,4.1vw,54px)}
  .login-stats{margin-top:24px}
  .login-panel{padding:24px}
  .login-card-head{margin-bottom:16px}
  .role-switch{margin:16px 0}
  .content{padding:18px 22px 30px}
  .page-head{margin-bottom:15px}
  .page-title{font-size:24px}
  .hero{min-height:208px;padding:19px 22px}
  .hero h2{font-size:25px;margin:8px 0 4px}
  .hero-actions{margin-top:12px}
  .hero-tags{margin-top:10px}
  .hero-side .ring{width:108px;height:108px}
  .kpi-grid{gap:10px;margin-bottom:14px}
  .kpi{min-height:92px;padding:12px 13px 10px}
  .kpi-val{font-size:24px;margin-top:5px}
  .pipeline{margin-bottom:14px}
  .pipe-step{padding:9px 10px}
  .pipe-step .n{font-size:18px}
  .dash-grid{gap:14px;margin-top:14px}
  .card-pad{padding:16px}
}
@media (max-width:1320px){
  .login-visual{padding:36px 40px 28px}
  .login-float{display:none}
  .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr) 260px}
  .dash-grid{grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr)}
  .iv-body{grid-template-columns:minmax(0,1fr) minmax(400px,.92fr)}
  .dh-wrap{width:min(82%,470px)}
}
@media (max-width:1120px){
  .shell{grid-template-columns:82px minmax(0,1fr)}
  .sidebar{padding:20px 10px 14px}
  .sidebar .brand-copy,.role-badge,.nav-label,.nav-item span,.nav-item .nav-badge,.sidebar-note,.sidebar-user .meta{display:none}
  .sidebar .brand{justify-content:center;padding:0}
  .nav-item{justify-content:center;padding:0;height:46px}
  .nav-item.active::before{left:-10px}
  .sidebar-user{justify-content:center;padding:10px 0 0}
  .sidebar-user .icon-btn{display:none}
  .topbar-search{width:220px}
  .content{padding:22px 22px 40px}
  .hero{grid-template-columns:minmax(0,1fr) 230px;padding:22px}
  .hero h2{font-size:26px}
  .dash-grid{grid-template-columns:1fr}
  .side-stack{display:grid;grid-template-columns:1fr 1fr}
  .job-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .iv-body{grid-template-columns:1fr;grid-template-rows:minmax(280px,46vh) minmax(0,1fr);padding:12px}
  .iv-panel{min-height:0}
  .stage-subtitle{left:14px;right:14px;bottom:12px}
  .stage-name{bottom:80px}
}
@media (max-width:860px){
  body{overflow:auto}
  .login{grid-template-columns:1fr;min-height:100vh}
  .login-visual{min-height:auto;padding:30px 26px 10px}
  .login-title{font-size:40px}
  .login-stats{gap:22px;margin-top:22px}
  .login-foot{display:none}
  .login-map{opacity:.4}
  .login-panel{padding:24px 22px 40px;border-left:0;border-top:1px solid var(--line);min-height:auto}
  .login-panel::before{display:none}
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{padding:0 16px;gap:8px}
  .topbar-search{display:none}
  .content{padding:18px 14px 34px}
  .page-head{align-items:flex-start;flex-direction:column}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1fr;min-height:auto}
  .hero-side{border-left:0;border-top:1px solid var(--line);padding:16px 0 0;flex-direction:row;justify-content:space-between}
  .hero-side .ring{width:96px;height:96px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}

  .job-grid{grid-template-columns:1fr}
